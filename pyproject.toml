[project]
name = "copilot-suporte"
version = "0.1.0"
description = "Copiloto de suporte: pipeline de chamados, busca semântica, triagem por vizinhos e rascunhos com LLM local"
readme = "README.md"
authors = [
    { name = "isantoDev", email = "isantos.code@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "msal>=1.39.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "snowballstemmer>=3.1.1",
    "torch>=2.14",
    "transformers>=4.57",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# No Linux (container) o torch vem só com CPU: a imagem fica ~2 GB menor. No Windows segue o do PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
