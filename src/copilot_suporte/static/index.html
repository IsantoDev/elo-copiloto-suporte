<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elo · Copiloto de Suporte</title>
<link rel="icon" type="image/svg+xml" href="/static/elo-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<script>
  try { const t = localStorage.getItem("elo-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --violeta: #6a10f3; --violeta-claro: #f1e9fe; --violeta-texto: #5a0bd6;
    --rosa: #f24479; --rosa-claro: #fde7ee; --ambar: #ffc74b; --ambar-claro: #fff4d9; --ambar-texto: #8a5a00;
    --tinta: #1a1625; --suave: #6b6578; --fraca: #9a94a6; --linha: #e6e2ec;
    --fundo: #f8f7fa; --papel: #ffffff; --afundado: #f2f0f5;
    --verde: #0f7b5f; --verde-claro: #ddf3eb;
    --degrade: linear-gradient(90deg, #6a10f3, #f24479);
    --sombra: 0 1px 2px rgb(26 22 37 / .04), 0 6px 20px rgb(26 22 37 / .05);
    --fonte: "Barlow", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --violeta: #9a5cff; --violeta-claro: #2a1d45; --violeta-texto: #c4a3ff;
      --rosa-claro: #3d1a27; --ambar-claro: #3a2f14; --ambar-texto: #ffd27a;
      --tinta: #ece9f2; --suave: #a59fb3; --fraca: #7d778a; --linha: #2c2638;
      --fundo: #16121f; --papel: #1e1929; --afundado: #251f32; --verde: #4fd1a5; --verde-claro: #16332a;
      --sombra: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --violeta: #9a5cff; --violeta-claro: #2a1d45; --violeta-texto: #c4a3ff;
    --rosa-claro: #3d1a27; --ambar-claro: #3a2f14; --ambar-texto: #ffd27a;
    --tinta: #ece9f2; --suave: #a59fb3; --fraca: #7d778a; --linha: #2c2638;
    --fundo: #16121f; --papel: #1e1929; --afundado: #251f32; --verde: #4fd1a5; --verde-claro: #16332a;
    --sombra: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 16px/1.55 var(--fonte); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--violeta-texto); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--violeta); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1 { font-size: 34px; font-weight: 600; margin: 0; letter-spacing: -.01em; line-height: 1.15; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 600; margin: 0 0 12px; }

  /* topo */
  .topo { background: var(--papel); border-bottom: 1px solid var(--linha); position: sticky; top: 0; z-index: 5; }
  .topo .dentro { padding: 10px 24px; display: flex; align-items: center; gap: 20px; min-height: 58px; }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 22px; color: var(--tinta); }
  .marca:hover { text-decoration: none; }
  .marca svg { width: 30px; height: 30px; }
  nav { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--tinta); font-weight: 500; white-space: nowrap; line-height: 1.4; }
  nav a:hover { background: var(--afundado); text-decoration: none; }
  nav a[aria-current="page"] { background: var(--violeta-claro); color: var(--violeta-texto); }
  .perfil { display: flex; align-items: center; gap: 8px; flex: none; }
  .perfil #sair { height: 34px; }
  .botao-tema { border: 1px solid var(--linha); background: var(--papel); border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--suave); }
  .botao-tema:hover { border-color: var(--violeta); color: var(--violeta-texto); }
  .botao-tema svg { width: 18px; height: 18px; }
  .segmentos { display: inline-flex; border: 1px solid var(--linha); border-radius: 10px; padding: 3px; gap: 3px; background: var(--afundado); flex-wrap: wrap; }
  .segmentos button { border: 0; background: none; border-radius: 7px; padding: 6px 14px; cursor: pointer; color: var(--suave); font-weight: 500; }
  .segmentos button[aria-pressed="true"] { background: var(--papel); color: var(--violeta-texto); box-shadow: var(--sombra); font-weight: 600; }
  .conta { display: flex; align-items: center; gap: 10px; color: inherit; border-radius: 10px; padding: 2px 6px; }
  .conta:hover { background: var(--afundado); text-decoration: none; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; box-shadow: var(--sombra); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--violeta-claro); color: var(--violeta-texto); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .perfil .quem { line-height: 1.15; white-space: nowrap; }
  .perfil .quem b { display: block; font-weight: 600; font-size: 15px; }
  .perfil .quem small { color: var(--suave); font-size: 12.5px; }
  @media (max-width: 1100px) { .perfil .quem { display: none; } }
  @media (max-width: 760px) { .topo .dentro { padding: 8px 12px; gap: 10px; } .perfil .quem { display: none; } nav a { padding: 6px 8px; } .marca span { display: none; } }

  main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 80px; }
  .estreito { max-width: 820px; margin: 0 auto; }

  /* comuns */
  .cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: 16px; padding: 20px 22px; box-shadow: var(--sombra); }
  .botao { border: 1px solid var(--linha); background: var(--papel); border-radius: 10px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
  .botao:hover { border-color: var(--violeta); }
  .botao.primario { background: var(--violeta); border-color: var(--violeta); color: #fff; font-weight: 600; }
  .botao.primario:hover { filter: brightness(1.08); }
  .botao.pequeno { padding: 4px 12px; font-size: 14px; }
  .botao[aria-pressed="true"] { background: var(--violeta-claro); border-color: var(--violeta); color: var(--violeta-texto); }
  .botao:disabled { opacity: .55; cursor: default; }
  .campo { width: 100%; padding: 11px 14px; border: 1px solid var(--linha); border-radius: 10px; background: var(--papel); }
  select.campo { padding: 9px 12px; }
  label.rotulo { display: block; font-size: 13.5px; color: var(--suave); margin-bottom: 4px; }
  .meta { color: var(--suave); font-size: 14px; }
  .etiqueta { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13.5px; white-space: nowrap; background: var(--afundado); color: var(--suave); }
  .etiqueta.violeta { background: var(--violeta-claro); color: var(--violeta-texto); }
  .etiqueta.rosa { background: var(--rosa-claro); color: var(--rosa); }
  .etiqueta.ambar { background: var(--ambar-claro); color: var(--ambar-texto); }
  .etiqueta.verde { background: var(--verde-claro); color: var(--verde); }
  .etiqueta.contorno { background: transparent; border: 1px solid var(--violeta); color: var(--violeta-texto); }
  .etiqueta.contorno.cinza { border-color: var(--linha); color: var(--suave); }
  .vazio { text-align: center; color: var(--suave); padding: 40px 20px; }
  .aviso { background: var(--ambar-claro); color: var(--ambar-texto); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; margin-bottom: 14px; }
  .erro { background: var(--rosa-claro); color: var(--rosa); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; }
  .barra { height: 6px; background: var(--afundado); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .barra i { display: block; height: 100%; background: var(--degrade); border-radius: 99px; }
  .giro { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--violeta-claro); border-top-color: var(--violeta); border-radius: 50%; animation: gira .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .esqueleto { background: linear-gradient(90deg, var(--afundado), var(--papel), var(--afundado)); background-size: 200% 100%; animation: brilho 1.4s infinite; border-radius: 8px; height: 14px; margin: 8px 0; }
  @keyframes brilho { to { background-position: -200% 0; } }

  /* entrar */
  .entrar { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .entrar .cartao { width: 100%; max-width: 400px; padding: 32px; }
  .entrar .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 24px; }
  .entrar .logo .simbolo, .entrar .logo .simbolo svg { width: 72px; height: 72px; display: block; }
  .entrar .logo b { margin-top: 4px; }
  .entrar .logo b { font-size: 30px; font-weight: 600; }
  .entrar form { display: grid; gap: 14px; }

  /* fila */
  .cabecalho { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; }
  .filtros select { width: auto; min-width: 150px; max-width: 240px; }
  .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
  .aba { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--suave); font-weight: 500; white-space: nowrap;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .aba:hover { color: var(--tinta); }
  .aba[aria-selected="true"] { color: var(--violeta-texto); border-bottom-color: var(--violeta); font-weight: 600; }
  .aba.discreta { font-size: 14.5px; }
  .linha-abas { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--linha); margin-bottom: 16px; }
  .linha-abas .abas { border-bottom: 0; margin-bottom: 0; flex: 1; min-width: 0; }
  .ordenar { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; white-space: nowrap; font-size: 14px; color: var(--suave); }
  .ordenar select { padding: 5px 30px 5px 10px; width: auto; }
  /* ir a um ticket pelo número: pequeno, na mesma linha das abas, sem disputar espaço com os filtros */
  .titulo-fila { flex: 1 1 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .ir-ticket { position: relative; flex: none; }
  .ir-ticket span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--suave); font-size: 14px; pointer-events: none; }
  .ir-ticket .campo { width: 170px; padding: 7px 10px 7px 26px; font-size: 14px; }
  @media (max-width: 760px) { .linha-abas { flex-direction: column; align-items: stretch; } .ordenar { padding: 6px 0; } }
  .espera { color: var(--ambar-texto); font-weight: 500; }
  .aba .contagem { margin-left: 8px; font-size: 12.5px; background: var(--afundado); color: var(--suave); border-radius: 99px; padding: 1px 8px; font-weight: 600; }
  .aba[aria-selected="true"] .contagem { background: var(--violeta-claro); color: var(--violeta-texto); }
  .pronto { font-weight: 500; }
  .pronto.solucao { color: var(--violeta-texto); }
  .pronto::before { content: "●"; font-size: 9px; margin-right: 4px; vertical-align: 2px; }
  .lista { display: grid; gap: 10px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; cursor: pointer; color: inherit; }
  .item:hover { border-color: var(--violeta); text-decoration: none; }
  .item .titulo { font-size: 18.5px; font-weight: 600; margin-top: 2px; }
  .item .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 700px) { .item { flex-direction: column; align-items: flex-start; } .item .tags { justify-content: flex-start; } }

  /* ticket */
  .voltar { display: inline-block; margin-bottom: 14px; font-size: 15px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .grade2 { grid-template-columns: 1fr; } }
  .sugestao .linha1 { display: flex; justify-content: space-between; }
  .sugestao .valor { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .sugestao .movidesk { font-size: 13.5px; color: var(--suave); }
  .bloco { margin-top: 14px; }
  .texto-ticket { white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .escrevendo::after { content: "▍"; color: var(--violeta); animation: pisca 1s steps(1) infinite; margin-left: 1px; }
  @keyframes pisca { 50% { opacity: 0; } }
  .parcial h4 { margin: 14px 0 4px; font-size: 16px; }
  .parcial ul { margin: 4px 0; padding-left: 22px; }
  .parcial p { margin: 4px 0; }
  .sem-solucao { color: var(--ambar-texto); }
  .rascunho h3 { margin: 0; font-size: 19px; font-weight: 600; display: inline; }
  .rascunho.solucao h3 { color: var(--violeta-texto); }
  .rascunho.analise h3 { color: var(--rosa); }
  .rascunho h4 { margin: 16px 0 4px; font-size: 16px; }
  .rascunho ol, .rascunho ul { margin: 6px 0; padding-left: 22px; }
  .rascunho li { margin: 4px 0; }
  .resposta-cliente { background: var(--afundado); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--linha); padding-top: 14px; margin-top: 16px; }
  .rodape-nota { font-style: italic; color: var(--suave); font-size: 13.5px; margin-top: 10px; }
  .parecido { display: block; background: var(--afundado); border-radius: 12px; padding: 12px 14px; color: inherit; margin-top: 8px; }
  .parecido:hover { text-decoration: none; outline: 1px solid var(--violeta); }
  .parecido[role="link"] { cursor: pointer; }
  .movidesk-link { font-size: 13px; white-space: nowrap; margin-left: 8px; }
  .parecido .linha1 { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--suave); }
  .parecido .sim { color: var(--violeta-texto); font-weight: 600; }
  .parecido b { display: block; font-weight: 600; margin-top: 2px; }
  .risco { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* pergunte */
  .conversa { display: grid; gap: 16px; margin: 24px 0 110px; }
  .msg-eu { justify-self: end; background: var(--violeta); color: #fff; padding: 10px 16px; border-radius: 16px 16px 4px 16px; max-width: 80%; font-weight: 500; }
  .msg-elo { display: flex; gap: 12px; align-items: flex-start; }
  .msg-elo .icone { width: 36px; height: 36px; border-radius: 9px; background: #16121f; display: grid; place-items: center; flex: none; }
  .msg-elo .icone svg { width: 24px; height: 24px; }
  .msg-elo .cartao { flex: 1; padding: 14px 18px; }
  .msg-elo .corpo { white-space: pre-wrap; }
  .msg-elo pre.codigo { position: relative; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--afundado); border: 1px solid var(--linha);
                        border-radius: 10px; padding: 12px 14px; margin: 8px 0; font: 13.5px/1.5 Consolas, "Cascadia Mono", monospace; }
  .msg-elo pre.codigo .copiar { position: absolute; top: 6px; right: 6px; font-family: var(--fonte); }
  .memoria { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .fontes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--suave); }
  .compor { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 20px 22px; background: linear-gradient(transparent, var(--fundo) 30%); }
  .compor form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 8px; box-shadow: var(--sombra); }
  .compor input { flex: 1; border: 0; background: transparent; padding: 8px 12px; outline: none; }
  .sugestoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* painel */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kpi .numero { font-size: 32px; font-weight: 600; line-height: 1.1; margin-top: 4px; }
  .kpi .delta { font-size: 13.5px; color: var(--suave); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-weight: 600; color: var(--suave); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
  td { padding: 10px; border-bottom: 1px solid var(--linha); }
  tr.clicavel { cursor: pointer; }
  tr.clicavel:hover td { background: var(--afundado); }
  .tabela-rolavel { overflow-x: auto; }
  select.campo.compacto { width: auto; min-width: 0; padding: 5px 30px 5px 10px; }
  .usuario-nome { font-weight: 600; }
  .usuario-detalhe { font-size: 13.5px; }
  .acoes-usuario { white-space: nowrap; text-align: right; }
  .acoes-usuario > * + * { margin-left: 6px; }
  .bom { color: var(--verde); } .ruim { color: var(--rosa); }
  #cadeado.ativo { border-color: var(--violeta); color: var(--violeta-texto); background: var(--violeta-claro); }
  /* acessos: cofre de credenciais, um cartão por sistema, agrupados por cliente */
  .largo-acessos { max-width: 1040px; }
  .icone-svg { display: inline-grid; place-items: center; flex: none; }
  .faixa-seguranca { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 14px 0 4px; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; color: var(--suave);
                     background: var(--afundado); border: 1px solid var(--linha); }
  .faixa-seguranca span { display: inline-flex; align-items: center; gap: 7px; }
  .faixa-seguranca .icone-svg { color: var(--violeta-texto); }
  .busca-com-icone { position: relative; flex: 1; min-width: 260px; }
  .filtros-base:empty { display: none; }
  .busca-com-icone > .icone-svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--suave); pointer-events: none; }
  .busca-com-icone .campo { padding-left: 42px; }
  .grupo-acessos summary { cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 18px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .grupo-acessos summary::-webkit-details-marker { display: none; }
  .grupo-acessos summary::after { content: "›"; color: var(--suave); font-size: 20px; transition: transform .15s; }
  .grupo-acessos[open] summary::after { transform: rotate(90deg); }
  .grupo-acessos { padding: 0; margin-bottom: 12px; }
  .nome-grupo { display: flex; align-items: center; gap: 12px; }
  .nome-grupo .etiqueta { font-size: 12.5px; font-weight: 500; }
  .inicial { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--degrade); color: #fff; font-weight: 700; font-size: 15px; flex: none; }
  .grade-acessos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding: 2px 18px 18px; }
  .acesso { border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; align-content: start;
            background: color-mix(in srgb, var(--afundado) 50%, var(--papel)); transition: border-color .15s; }
  .acesso:hover { border-color: color-mix(in srgb, var(--violeta) 40%, var(--linha)); }
  .acesso .topo-acesso { display: flex; gap: 12px; align-items: center; }
  .acesso .tipo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--violeta-claro); color: var(--violeta-texto); flex: none; }
  .titulo-acesso { flex: 1; min-width: 0; line-height: 1.3; }
  .titulo-acesso b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15.5px; }
  .titulo-acesso .meta { font-size: 12.5px; }
  .acoes-acesso { display: flex; gap: 2px; align-items: center; }
  .confirma-excluir { white-space: nowrap; }
  .botao-icone { border: 0; background: none; color: var(--suave); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .botao-icone:hover { background: var(--afundado); color: var(--tinta); }
  .botao-icone:focus-visible { outline: 2px solid var(--violeta); outline-offset: 1px; }
  .botao-icone.perigo:hover { color: var(--rosa); }
  .botao-icone.copiado, .botao-icone.copiado:hover { color: var(--verde); }
  .campos-acesso { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 12px; align-items: center; }
  .rotulo-acesso { color: var(--suave); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .valor-acesso { display: flex; align-items: center; gap: 2px; min-width: 0; height: 34px; background: var(--papel); border: 1px solid var(--linha); border-radius: 9px; padding: 0 3px 0 10px; transition: border-color .15s; }
  .valor-acesso code { flex: 1; min-width: 0; background: none; padding: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .valor-acesso .botao-icone { width: 28px; height: 28px; }
  .valor-acesso.revelada { border-color: color-mix(in srgb, var(--ambar) 60%, var(--linha)); }
  .contagem-senha { grid-column: 2; height: 3px; margin-top: -4px; border-radius: 2px; background: var(--ambar); transform-origin: left; animation: esvaziar 30s linear forwards; }
  @keyframes esvaziar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .obs-acesso { font-size: 13.5px; color: var(--suave); white-space: pre-wrap; border-left: 3px solid var(--linha); padding-left: 10px; }
  .rodape-acesso { font-size: 12px; color: var(--suave); opacity: .8; margin-top: -4px; }
  .acessos-vazio { display: grid; justify-items: center; gap: 6px; padding: 44px 20px; }
  .acessos-vazio h2 { margin: 6px 0 0; font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--tinta); }
  .selo-vazio { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--violeta-claro); color: var(--violeta-texto); }
  .grupo-acessos summary .nome-grupo { flex: 1; }
  .adicionar-no-grupo { margin-right: 12px; font-size: 13px; }
  .grupo-acessos:not([open]) .adicionar-no-grupo { opacity: .75; }
  .formulario-no-grupo { padding: 0 18px 4px; }
  .formulario-no-grupo > div > .cartao { margin-top: 0; }
  .adicionar-acesso { display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; font: inherit; color: inherit;
                      border-style: dashed; background: transparent; min-height: 74px; }
  .adicionar-acesso b { display: block; font-size: 15px; }
  .adicionar-acesso .meta { font-size: 12.5px; }
  .adicionar-acesso:hover { background: var(--violeta-claro); }
  .blocos-acesso { display: grid; gap: 12px; }
  .bloco-acesso { position: relative; border: 1px solid var(--linha); border-radius: 14px; padding: 12px 16px 16px; margin: 0; display: grid; gap: 12px; min-width: 0;
                  background: color-mix(in srgb, var(--afundado) 50%, var(--papel)); }
  .bloco-acesso legend { padding: 0 6px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--violeta-texto); }
  .bloco-acesso > .botao-icone.perigo { position: absolute; top: 6px; right: 8px; }
  .atalhos-sistema { display: flex; flex-wrap: wrap; gap: 6px; }
  .atalhos-sistema .filtro { padding: 3px 10px; font-size: 13px; }
  .adicionar-sistema { justify-self: start; border-style: dashed; }
  /* fila: o card do Planner dos tickets com o time de produto, em evidência */
  .planner { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; margin-top: 8px; padding: 5px 11px; border-radius: 9px; font-size: 13.5px;
             background: var(--violeta-claro); color: var(--violeta-texto); border: 1px solid color-mix(in srgb, var(--violeta) 35%, transparent);
             text-decoration: none; cursor: pointer; transition: border-color .15s, background .15s; }
  .planner:hover, .planner:focus-visible { border-color: var(--violeta); background: color-mix(in srgb, var(--violeta) 18%, var(--papel)); outline: none; }
  .planner b { font-weight: 700; flex: none; }
  .planner .titulo-planner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--tinta); }
  .planner.falta { background: var(--ambar-claro); color: var(--ambar-texto);
                   border-color: color-mix(in srgb, var(--ambar) 45%, transparent); cursor: help; }
  .planner.falta span { color: var(--suave); }
  .planner .coluna-planner { font-weight: 600; flex: none; }
  .planner .quem-planner { color: var(--suave); flex: none; }
  .planner .atraso-planner { color: var(--rosa); font-weight: 600; flex: none; }
  .planner .titulo-planner { color: var(--suave); }
  .planner.concluido { background: var(--verde-claro); color: var(--verde); border-color: color-mix(in srgb, var(--verde) 45%, transparent); }
  .planner.concluido .coluna-planner::after { content: " · avisar o cliente"; font-weight: 500; }
  .planner-ticket { margin: -8px 0 18px; }
  .planner-ticket .planner { font-size: 14.5px; padding: 8px 14px; margin: 0; }
  .campo-rotulado { display: grid; gap: 5px; }
  .campo-rotulado > span { font-size: 12.5px; font-weight: 600; color: var(--suave); }
  .com-botao { position: relative; }
  .com-botao .campo { padding-right: 44px; }
  .com-botao .botao-icone { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  .mini { border: 0; background: none; color: var(--violeta-texto); cursor: pointer; font-size: 13.5px; padding: 0 2px; }

  /* base de conhecimento */
  .busca-base { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
  .busca-base .campo { flex: 1; min-width: 220px; }
  .busca-base select.campo { flex: none; width: auto; min-width: 170px; }
  .soltar { border: 2px dashed var(--linha); border-radius: 12px; padding: 22px; text-align: center; color: var(--suave); cursor: pointer; }
  .soltar.sobre, .soltar:hover { border-color: var(--violeta); background: var(--violeta-claro); color: var(--violeta-texto); }
  .soltar b { color: var(--tinta); }
  .envio { display: grid; gap: 10px; margin-top: 14px; }
  .doc { display: flex; gap: 14px; align-items: flex-start; }
  .doc + .doc { margin-top: 10px; }
  .doc .tipo { flex: none; width: 46px; height: 54px; border-radius: 8px; background: var(--afundado); display: grid; place-items: center;
               font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--suave); text-transform: uppercase; }
  .doc .tipo.pdf { background: var(--rosa-claro); color: var(--rosa); }
  .doc .info { flex: 1; min-width: 0; }
  .doc .nome { font-size: 17.5px; font-weight: 600; overflow-wrap: anywhere; }
  .doc .descricao { margin-top: 4px; }
  .doc .trecho { margin-top: 8px; background: var(--afundado); border-radius: 8px; padding: 8px 12px; font-size: 14px; white-space: pre-wrap; }
  .doc mark { background: var(--ambar-claro); color: var(--ambar-texto); border-radius: 3px; padding: 0 2px; }
  .doc .lado { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
  .doc .chave-rag { display: flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .link-discreto { border: 0; background: none; color: var(--suave); font-size: 13.5px; cursor: pointer; padding: 0; }
  .link-discreto:hover { color: var(--rosa); text-decoration: underline; }
  .leitor-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .leitor-topo h1 { margin: 0 0 4px; overflow-wrap: anywhere; }
  .leitor-topo .acoes-leitor { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .leitor-pdf { width: 100%; height: calc(100vh - 230px); min-height: 480px; border: 1px solid var(--linha); border-radius: 12px; background: var(--afundado); display: block; }
  .leitor-texto { font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; }
  .leitor-texto.puro { white-space: pre-wrap; }
  .leitor-texto h2, .leitor-texto h3, .leitor-texto h4 { margin: 18px 0 6px; }
  .leitor-texto ul { margin: 6px 0; padding-left: 22px; }
  .leitor-texto p { margin: 8px 0; }
  .leitor-texto code { background: var(--afundado); border-radius: 4px; padding: 1px 5px; font-size: 14.5px; }
  @media (max-width: 700px) { .doc { flex-wrap: wrap; } .doc .lado { flex-direction: row; align-items: center; width: 100%; justify-content: flex-start; flex-wrap: wrap; } }

  /* ---------- acabamento: profundidade e movimento, com os mesmos tokens e a mesma marca ---------- */
  :root { --brilho-marca: color-mix(in srgb, var(--violeta) 9%, transparent); --anel: 0 0 0 3px color-mix(in srgb, var(--violeta) 22%, transparent); }
  body { background: radial-gradient(1100px 420px at 50% -160px, var(--brilho-marca), transparent 70%) fixed, var(--fundo); }
  .topo { background: color-mix(in srgb, var(--papel) 84%, transparent); backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); }
  .topo::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--degrade); opacity: .5; }
  nav a { transition: background .15s, color .15s; }
  h1 + p.meta { font-size: 15px; margin-top: 6px; }

  .cartao { transition: border-color .15s, box-shadow .15s, transform .15s; }
  .botao { transition: border-color .15s, background .15s, box-shadow .15s, transform .15s; }
  .botao.primario { background: linear-gradient(135deg, var(--violeta), color-mix(in srgb, var(--violeta) 82%, var(--rosa)));
                    box-shadow: 0 4px 14px color-mix(in srgb, var(--violeta) 30%, transparent); }
  .botao.primario:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 18px color-mix(in srgb, var(--violeta) 38%, transparent); }
  .campo { transition: border-color .15s, box-shadow .15s; }
  .campo:focus { outline: none; border-color: var(--violeta); box-shadow: var(--anel); }

  /* fila: faixa lateral pela urgência e o cartão sobe ao passar o mouse */
  .item { position: relative; overflow: hidden; padding-left: 24px; }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; }
  .item.urg-critico::before, .item.urg-alta::before { background: var(--rosa); }
  .item.urg-media::before { background: var(--ambar); }
  .item.pronto-solucao::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
                                background: linear-gradient(90deg, color-mix(in srgb, var(--violeta) 7%, transparent), transparent 45%); }
  .item:hover { border-color: color-mix(in srgb, var(--violeta) 60%, var(--linha)); transform: translateY(-1px);
                box-shadow: 0 10px 28px color-mix(in srgb, var(--violeta) 14%, transparent); }
  .item .titulo { letter-spacing: -.005em; }

  /* painel: o número em destaque e a faixa da marca no alto de cada indicador */
  .kpi { position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--degrade); opacity: .75; }
  .kpi .numero { font-size: 34px; letter-spacing: -.01em; }
  .kpi:hover { border-color: color-mix(in srgb, var(--violeta) 45%, var(--linha)); }

  /* base: ações do documento numa linha só, documentos separados por linha */
  .doc + .doc { margin-top: 0; border-top: 1px solid var(--linha); }
  .doc { padding: 14px 0; }
  .doc:first-child { padding-top: 2px; } .doc:last-child { padding-bottom: 2px; }
  .doc .tipo { width: 42px; height: 50px; border-radius: 10px; }
  .doc .tipo.md { background: var(--violeta-claro); color: var(--violeta-texto); }
  .doc .lado { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-end; max-width: 360px; gap: 8px 12px; }
  .doc .nome { transition: color .15s; } .doc .nome:hover { color: var(--violeta-texto); text-decoration: none; }

  /* pergunte e busca: boas-vindas no lugar da tela vazia */
  .boas-vindas { text-align: center; margin: 44px auto 8px; max-width: 640px; }
  .boas-vindas .simbolo { width: 64px; height: 64px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 18px;
                          background: var(--papel); border: 1px solid var(--linha);
                          box-shadow: 0 10px 34px color-mix(in srgb, var(--violeta) 28%, transparent); }
  .boas-vindas .simbolo svg { width: 40px; height: 40px; }
  .boas-vindas h2 { font-size: 22px; letter-spacing: -.01em; text-transform: none; color: var(--tinta); margin: 0 0 6px; }
  .boas-vindas p { color: var(--suave); margin: 0 0 22px; }
  .sugestoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; text-align: left; }
  .sugestao-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--linha); background: var(--papel); border-radius: 14px;
                   padding: 14px 16px; cursor: pointer; text-align: left; font-weight: 500; box-shadow: var(--sombra);
                   transition: border-color .15s, transform .15s, box-shadow .15s; }
  .sugestao-card:hover { border-color: color-mix(in srgb, var(--violeta) 60%, var(--linha)); transform: translateY(-1px);
                         box-shadow: 0 8px 22px color-mix(in srgb, var(--violeta) 14%, transparent); }
  .sugestao-card .seta { color: var(--violeta-texto); flex: none; font-weight: 600; }
  .dicas-busca { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .dicas-busca .etiqueta { cursor: pointer; }
  .dicas-busca .etiqueta:hover { background: var(--violeta-claro); color: var(--violeta-texto); }

  /* conversa */
  .msg-eu { background: linear-gradient(135deg, var(--violeta), color-mix(in srgb, var(--violeta) 80%, var(--rosa)));
            box-shadow: 0 6px 18px color-mix(in srgb, var(--violeta) 25%, transparent); }
  .msg-elo .icone { background: var(--papel); border: 1px solid var(--linha); }
  .compor form { transition: border-color .15s, box-shadow .15s; }
  .compor form:focus-within { border-color: var(--violeta); box-shadow: var(--anel), var(--sombra); }

  /* ---------- moderno: a marca com mais presença, sem trocar paleta nem fonte ---------- */
  ::selection { background: color-mix(in srgb, var(--violeta) 30%, transparent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--suave) 45%, transparent) transparent; }
  h1 { font-weight: 700; letter-spacing: -.025em; }
  .kpi .numero, .contagem, td { font-variant-numeric: tabular-nums; }
  .cartao { border-radius: 18px; }

  /* menu e abas: a seleção ganha o degradê da marca */
  nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--violeta) 70%, transparent); }
  .aba[aria-selected="true"] { border-bottom-color: transparent; background: var(--degrade) bottom / 100% 2px no-repeat; }
  .avatar { background: var(--degrade); color: #fff; box-shadow: 0 0 0 2px var(--papel), 0 0 0 3px color-mix(in srgb, var(--violeta) 45%, transparent); }

  /* etiquetas com contorno da própria cor: mais nítidas no claro e no escuro */
  .etiqueta { border: 1px solid transparent; font-weight: 500; }
  .etiqueta.violeta { border-color: color-mix(in srgb, var(--violeta) 28%, transparent); }
  .etiqueta.rosa { border-color: color-mix(in srgb, var(--rosa) 30%, transparent); }
  .etiqueta.ambar { border-color: color-mix(in srgb, var(--ambar) 40%, transparent); }
  .etiqueta.verde { border-color: color-mix(in srgb, var(--verde) 30%, transparent); }

  /* o que o Elo escreveu (rascunho, resposta do Pergunte) tem a borda em degradê */
  .ia, .msg-elo .cartao {
    border: 1px solid transparent;
    background: linear-gradient(var(--papel), var(--papel)) padding-box,
                linear-gradient(135deg, color-mix(in srgb, var(--violeta) 75%, transparent), color-mix(in srgb, var(--rosa) 45%, transparent) 45%, var(--linha) 75%) border-box;
    box-shadow: 0 10px 30px color-mix(in srgb, var(--violeta) 10%, transparent);
  }

  /* troca de tela */
  #app.entrada > * { animation: surgir .32s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes surgir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* entrar: aurora nas cores da marca atrás de um cartão de vidro */
  /* a janela toda, não só a coluna central; hidden: as manchas da aurora saem da tela de propósito e não podem virar rolagem */
  .entrar { position: fixed; inset: 0; overflow: hidden; isolation: isolate; min-height: 0; }
  .entrar::before, .entrar::after { content: ""; position: absolute; z-index: -1; width: 620px; height: 620px; border-radius: 50%; filter: blur(90px); opacity: .45; }
  .entrar::before { background: var(--violeta); top: -220px; left: -160px; animation: aurora 16s ease-in-out infinite alternate; }
  .entrar::after { background: var(--rosa); bottom: -260px; right: -180px; opacity: .3; animation: aurora 19s ease-in-out infinite alternate-reverse; }
  @keyframes aurora { to { transform: translate(120px, 80px) scale(1.15); } }
  .entrar .cartao { background: color-mix(in srgb, var(--papel) 78%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                    border-color: color-mix(in srgb, var(--violeta) 22%, var(--linha)); box-shadow: 0 24px 60px rgb(0 0 0 / .18); }
  .entrar .logo .simbolo { filter: drop-shadow(0 8px 24px color-mix(in srgb, var(--violeta) 45%, transparent)); }
  .entrar .logo b { background: var(--degrade); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
  .entrar .botao.primario { padding: 11px 16px; }

  /* interruptor (liga/desliga) no lugar da caixinha: Usar no RAG, fontes, pausa */
  input.interruptor { appearance: none; -webkit-appearance: none; flex: none; width: 38px; height: 22px; border-radius: 99px; margin: 0;
                      background: var(--linha); position: relative; cursor: pointer; transition: background .2s; }
  input.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
                             background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .2s; }
  input.interruptor:checked { background: var(--degrade); }
  input.interruptor:checked::after { transform: translateX(16px); }
  input.interruptor:disabled { opacity: .5; cursor: default; }
  .linha-chave { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 12px 0; cursor: pointer; }
  .linha-chave + .linha-chave { border-top: 1px solid var(--linha); }
  .doc .chave-rag { gap: 8px; }

  /* base: resumo, filtros rápidos por origem e ordenação */
  .resumo-base { margin: 18px 0 4px; }
  .resumo-base .kpi { padding: 14px 16px; }
  .resumo-base .kpi .numero { font-size: 26px; }
  .linha-filtros { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: -2px 0 6px; }
  .filtros-base { display: flex; gap: 6px; flex-wrap: wrap; }
  .filtro { border: 1px solid var(--linha); background: var(--papel); color: var(--suave); border-radius: 99px; padding: 5px 12px; cursor: pointer;
            font-weight: 500; font-size: 14px; transition: border-color .15s, background .15s, color .15s; }
  .filtro:hover { border-color: color-mix(in srgb, var(--violeta) 50%, var(--linha)); color: var(--tinta); }
  .filtro[aria-pressed="true"] { background: var(--violeta-claro); border-color: color-mix(in srgb, var(--violeta) 45%, transparent); color: var(--violeta-texto); }
  .filtro .contagem { margin-left: 6px; font-size: 12px; opacity: .8; }

  /* painel: barras e medidores de uma série só (a cor da marca, validada nos dois temas); trilho recessivo */
  .trilho { position: relative; display: block; flex: 1; min-width: 60px; height: 8px; background: var(--afundado); border-radius: 4px; }
  .trilho i { display: block; height: 100%; background: var(--violeta); border-radius: 4px; }
  .trilho .marca-time { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tinta); opacity: .55; border-radius: 1px; }
  .kpi-medidor { margin: 10px 0 6px; } .kpi-medidor .trilho { height: 6px; }
  .barra-celula { display: flex; align-items: center; gap: 12px; min-width: 170px; }
  .barra-celula .valor { min-width: 44px; font-variant-numeric: tabular-nums; }
  .tendencia { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
  .tendencia.bom { color: var(--verde); } .tendencia.ruim { color: var(--rosa); }
  .tendencia > span[aria-hidden] { font-size: .8em; }
  .tabela-painel td { vertical-align: middle; }
  .legenda-sla { display: inline-flex; align-items: center; gap: 6px; }
  .marca-legenda { display: inline-block; width: 2px; height: 12px; background: var(--tinta); opacity: .55; border-radius: 1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* configurações: saúde de relance e abas */
  .saude { margin: 18px 0 8px; }
  .status { padding: 14px 16px; }
  .status b { display: block; font-size: 20px; font-weight: 600; margin: 2px 0; }
  .rotulo-status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
  .luz { width: 8px; height: 8px; border-radius: 50%; background: var(--fraca); }
  .status.ok .luz { background: var(--verde); box-shadow: 0 0 0 3px color-mix(in srgb, var(--verde) 22%, transparent); }
  .status.atencao .luz { background: var(--ambar); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ambar) 25%, transparent); }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<header class="topo" id="topo" hidden>

</header>
<main id="app"></main>

<script>
"use strict";
const app = document.getElementById("app");
let eu = null;
let pollRascunho = null;

// ---------- utilidades ----------
function h(tag, attrs = {}, ...filhos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat()) if (f != null && f !== false) el.append(f.nodeType ? f : document.createTextNode(String(f)));
  return el;
}
async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes,
    body: opcoes.body ? JSON.stringify(opcoes.body) : undefined });
  if (r.status === 401 && caminho !== "/api/entrar") { eu = null; telaEntrar(); throw new Error("sessão expirada"); }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof dados.detail === "string" ? dados.detail : "Algo deu errado (" + r.status + ")");
  return dados;
}
function toast(msg) {
  const t = h("div", { class: "erro toast", role: "alert" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 5000);
}
// Lê uma resposta em linhas JSON à medida que chega (rascunho e Pergunte sendo escritos).
let leituraAtual = null;  // a leitura da tela aberta; cancelada ao trocar de tela
async function aoVivo(caminho, opcoes, aoEvento) {
  const controle = new AbortController();
  leituraAtual = controle;
  const r = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes,
    body: opcoes && opcoes.body ? JSON.stringify(opcoes.body) : undefined, signal: controle.signal });
  if (r.status === 401) { eu = null; telaEntrar(); return; }
  if (!r.ok) throw new Error("Algo deu errado (" + r.status + ")");
  const leitor = r.body.getReader(), decodificador = new TextDecoder();
  let resto = "";
  for (;;) {
    const { value, done } = await leitor.read();
    if (done) break;
    resto += decodificador.decode(value, { stream: true });
    const linhas = resto.split("\n");
    resto = linhas.pop();
    for (const linha of linhas) if (linha.trim()) aoEvento(JSON.parse(linha));
  }
}
// Cache das telas: voltar para a fila ou reabrir um ticket aparece na hora.
const cacheApi = new Map();
function preCarregar(caminho) {
  if (cacheApi.has(caminho)) return;
  cacheApi.set(caminho, null);  // marca para não pedir duas vezes
  api(caminho).then(d => cacheApi.set(caminho, d)).catch(() => cacheApi.delete(caminho));
}
// Mostra o que está no cache (se houver) e busca a versão nova; montar(dados)
async function comCache(caminho, montar) {
  const guardado = cacheApi.get(caminho);
  if (guardado) montar(guardado);
  const novo = await api(caminho);
  cacheApi.set(caminho, novo);
  if (!guardado || JSON.stringify(guardado) !== JSON.stringify(novo)) montar(novo);
}
// Link para abrir o chamado no próprio Movidesk (nova aba). Com o protocolo quando houver.
function linkMovidesk(id, protocolo, rotulo = "abrir no Movidesk ↗") {
  if (!eu || !eu.movidesk_url) return null;
  const href = protocolo ? `${eu.movidesk_url}/Ticket/EditByProtocol/${protocolo}` : `${eu.movidesk_url}/Ticket/Edit/${id}`;
  return h("a", { class: "movidesk-link", href, target: "_blank", rel: "noopener", title: `Abrir o chamado #${id} no Movidesk`,
    onclick: (e) => e.stopPropagation() }, rotulo);
}
// Um cartão que leva a uma tela do Elo, mas pode conter o link do Movidesk (link dentro de link não vale em HTML).
function cartaoLink(destino, ...filhos) {
  return h("div", { class: "parecido", role: "link", tabindex: "0",
    onclick: () => { location.hash = destino; },
    onkeydown: (e) => { if (e.key === "Enter") location.hash = destino; } }, ...filhos);
}
function pct(x) { return x == null ? "—" : Math.round(x * 100) + "%"; }
function horas(x) {
  if (x == null) return "—";
  const a = Math.abs(x);
  if (a < 1) return Math.round(a * 60) + " min";
  if (a < 48) return a.toFixed(a < 10 ? 1 : 0).replace(".", ",") + " h";
  return Math.round(a / 24) + " dias";
}
function desde(iso) {
  const min = (Date.now() - new Date(iso)) / 60000;
  if (min < 60) return "há " + Math.max(1, Math.round(min)) + " min";
  if (min < 48 * 60) return "há " + Math.round(min / 60) + " h";
  return "há " + Math.round(min / 1440) + " dias";
}
function iniciais(nome) { return (nome || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join(""); }
function carregando(n = 4) { return h("div", { class: "cartao" }, ...Array.from({ length: n }, (_, i) => h("div", { class: "esqueleto", style: `width:${90 - i * 12}%` }))); }
function falha(msg) { return h("div", { class: "erro" }, msg || "Sem conexão com o Elo. Tente de novo."); }
// O símbolo do Elo (o <symbol id="elo"> do topo da página), como elemento.
function svgElo() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 48 48");
  const uso = document.createElementNS("http://www.w3.org/2000/svg", "use");
  uso.setAttribute("href", "#elo");
  svg.append(uso);
  return svg;
}
function urgClasse(u) { return { "Crítico": "rosa", "Alta": "rosa", "Média": "ambar" }[u] || ""; }
const PAPEL = { analista: "Analista", gestor: "Gestor", admin: "Admin" };
async function avaliar(alvo, valor, ticket_id, detalhe) {
  try { await api("/api/feedback", { method: "POST", body: { alvo, valor, ticket_id, detalhe } }); } catch {}
}
function botaoAvaliar(rotulo, alvo, valor, ticket_id, detalhe, grupo) {
  const b = h("button", { class: "botao", "aria-pressed": "false", onclick: () => {
    if (b.getAttribute("aria-pressed") === "true") return;
    (grupo || []).forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    avaliar(alvo, valor, ticket_id, detalhe);
  } }, rotulo);
  return b;
}

// ---------- rotas ----------
const ROTAS = [
  [/^#\/fila$/, telaFila], [/^#\/ticket\/(\d+)$/, telaTicket], [/^#\/caso\/(\d+)$/, telaCaso],
  [/^#\/busca(?:\?q=(.*))?$/, telaBusca], [/^#\/pergunte$/, telaPergunte], [/^#\/base$/, telaBase], [/^#\/acessos$/, telaAcessos], [/^#\/base\/(\d+)$/, telaDocumento],
  [/^#\/painel$/, telaPainel], [/^#\/config$/, telaConfig], [/^#\/conta$/, telaConta],
];
function inicio() { return "#/fila"; }  // todo papel começa na Fila; Painel e Configurações ficam no menu
function rotear() {
  clearTimeout(pollRascunho);
  if (leituraAtual) { leituraAtual.abort(); leituraAtual = null; }
  if (!eu) return;
  const hash = location.hash || inicio();
  for (const [re, tela] of ROTAS) {
    const m = hash.match(re);
    if (m) {
      marcarMenu(hash); window.scrollTo(0, 0);
      app.classList.remove("entrada"); void app.offsetWidth; app.classList.add("entrada");  // a tela nova surge (só na troca de tela)
      return tela(...m.slice(1));
    }
  }
  location.hash = inicio();
}
window.addEventListener("hashchange", rotear);

function marcarMenu(hash) {
  const itens = [["#/fila", "Fila"], ["#/busca", "Busca"], ["#/pergunte", "Pergunte"], ["#/base", "Base de conhecimento"]];
  if (eu.papel !== "analista") itens.push(["#/painel", "Painel"]);
  if (eu.papel === "admin") itens.push(["#/config", "Configurações"]);
  const ativo = hash.startsWith("#/ticket") || hash.startsWith("#/caso") ? "#/fila" : hash.startsWith("#/base") ? "#/base" : hash.split("?")[0];
  document.getElementById("cadeado").classList.toggle("ativo", hash === "#/acessos");
  document.getElementById("menu").replaceChildren(...itens.map(([href, txt]) =>
    h("a", { href, "aria-current": ativo === href ? "page" : null }, txt)));
}

// ---------- entrar ----------

function telaEntrar() {
  document.getElementById("topo").hidden = true;
  const erro = h("div", { class: "erro", hidden: true });
  const email = h("input", { class: "campo", type: "email", required: true, autocomplete: "username", placeholder: "voce@empresa.com.br" });
  const senha = h("input", { class: "campo", type: "password", required: true, autocomplete: "current-password" });
  const enviar = h("button", { class: "botao primario", type: "submit" }, "Entrar");
  // o símbolo precisa nascer no namespace SVG: innerHTML faz isso, createElement("svg") não
  const simbolo = h("div", { class: "simbolo", "aria-hidden": "true" });
  simbolo.innerHTML = '<svg viewBox="0 0 48 48"><use href="#elo"/></svg>';
  app.replaceChildren(h("div", { class: "entrar" }, h("div", { class: "cartao" },
    h("div", { class: "logo" }, simbolo, h("b", {}, "Elo"), h("span", { class: "meta" }, "copiloto de suporte")),
    h("form", { onsubmit: async (e) => {
      e.preventDefault(); erro.hidden = true; enviar.disabled = true;
      try { await api("/api/entrar", { method: "POST", body: { email: email.value, senha: senha.value } }); await comecar(true); }
      catch (err) { erro.textContent = err.message; erro.hidden = false; }
      finally { enviar.disabled = false; }
    } },
      h("div", {}, h("label", { class: "rotulo" }, "E-mail da empresa"), email),
      h("div", {}, h("label", { class: "rotulo" }, "Senha"), senha),
      erro, enviar))));
  email.focus();
}

// ---------- fila ----------
const SITUACOES = [
  ["novo", "Novos"], ["atendimento", "Em atendimento"], ["produto", "Aguardando produto"],
  ["cliente", "Aguardando cliente"], ["outros", "Outros times"],
];
const estadoFila = { de: "meus", servico: "", urgencia: "", empresa: "", ordem: "prioridade", aba: null };
const ORDENS = [
  ["prioridade", "Prioridade do Elo"], ["antigos", "Mais antigos"],
  ["sem_resposta", "Mais tempo sem resposta"], ["criticidade", "Criticidade"],
];
const PESO_URGENCIA = { "Crítico": 0, "Alta": 1, "Média": 2, "Baixa": 3 };
// desde quando o cliente espera um retorno do analista (a última resposta pública, ou a abertura)
function esperaDesde(t) { return new Date(t.ultima_resposta_em || t.criado_em).getTime(); }
function ordenar(lista, ordem) {
  const abertura = t => new Date(t.criado_em).getTime();
  const copia = [...lista];  // "prioridade" já vem ordenada do servidor
  if (ordem === "antigos") copia.sort((a, b) => abertura(a) - abertura(b));
  if (ordem === "sem_resposta") copia.sort((a, b) => esperaDesde(a) - esperaDesde(b));
  if (ordem === "criticidade") copia.sort((a, b) =>
    (PESO_URGENCIA[urgenciaDe(a)] ?? 4) - (PESO_URGENCIA[urgenciaDe(b)] ?? 4) || abertura(a) - abertura(b));
  return copia;
}
async function telaFila() {
  const corpo = h("div", { class: "lista" }, carregando(2), carregando(2));
  const resumo = h("div", { class: "meta" }, "carregando…");
  const abas = h("div", { class: "abas", role: "tablist" });
  // a fila se atualiza sozinha a cada 2 min; o botão traz do Movidesk na hora (fechou lá, some aqui)
  const botaoAtualizar = h("button", { class: "botao", title: "Buscar agora o que mudou no Movidesk", onclick: async () => {
    botaoAtualizar.disabled = true;
    botaoAtualizar.replaceChildren(h("span", { class: "giro" }), "Atualizando…");
    try { await api("/api/atualizar", { method: "POST" }); cacheApi.clear(); await carregar(); }
    catch (e) { toast(e.message); }
    botaoAtualizar.disabled = false; botaoAtualizar.replaceChildren("↻ Atualizar");
  } }, "↻ Atualizar");
  const deSel = h("select", { class: "campo", "aria-label": "Ver tickets de", onchange: () => { estadoFila.de = deSel.value; estadoFila.aba = null; carregar(); } },
    h("option", { value: "meus" }, "Meus tickets"), h("option", { value: "time" }, "Time todo"));
  const servSel = h("select", { class: "campo", "aria-label": "Módulo", onchange: () => { estadoFila.servico = servSel.value; desenhar(); } });
  const urgSel = h("select", { class: "campo", "aria-label": "Urgência", onchange: () => { estadoFila.urgencia = urgSel.value; desenhar(); } },
    ...["", "urgentes", "Crítico", "Alta", "Média", "Baixa"].map(v => h("option", { value: v }, v === "" ? "Toda urgência" : v === "urgentes" ? "Só urgentes" : v)));
  urgSel.value = estadoFila.urgencia;
  const empSel = h("select", { class: "campo", "aria-label": "Empresa", onchange: () => { estadoFila.empresa = empSel.value; desenhar(); } });
  const ordemSel = h("select", { class: "campo", "aria-label": "Ordenar por", onchange: () => { estadoFila.ordem = ordemSel.value; desenhar(); } },
    ...ORDENS.map(([v, r]) => h("option", { value: v }, r)));
  ordemSel.value = estadoFila.ordem;
  // ir direto a um ticket: número (#3205) ou protocolo (202609003205), de qualquer analista e mesmo fechado
  const numero = h("input", { class: "campo", type: "search", inputmode: "numeric", placeholder: "Nº do ticket", "aria-label": "Abrir ticket pelo número ou protocolo",
    title: "Número (3205) ou protocolo (202609003205) — Enter para abrir" });
  const irAoTicket = async (e) => {
    e.preventDefault();
    const n = numero.value.replace(/\D/g, "");
    if (!n) return numero.focus();
    numero.disabled = true;
    try { const t = await api("/api/ticket/" + n); cacheApi.set("/api/ticket/" + t.ticket_id, t); location.hash = "#/ticket/" + t.ticket_id; }
    catch (err) { toast(err.message === "ticket não encontrado" ? `Ticket ${n} não encontrado.` : err.message); numero.disabled = false; numero.select(); }
  };
  const irPara = h("form", { class: "ir-ticket", role: "search", onsubmit: irAoTicket }, h("span", { "aria-hidden": "true" }, "#"), numero);
  app.replaceChildren(
    // o campo fica na linha do título, onde sobra espaço: abas e filtros continuam como estavam
    h("div", { class: "cabecalho" }, h("div", { class: "titulo-fila" }, h("div", {}, h("h1", {}, "Fila"), resumo), irPara),
      h("div", { class: "filtros" }, deSel, empSel, servSel, urgSel, botaoAtualizar)),
    h("div", { class: "linha-abas" }, abas, h("label", { class: "ordenar" }, "Ordenar:", ordemSel)), corpo);
  api("/api/analistas").then(lista => {
    for (const a of lista) deSel.append(h("option", { value: a.id }, `${a.nome} (${a.abertos})`));
    deSel.value = estadoFila.de;
  }).catch(() => {});
  let dados = null;
  async function carregar() {
    corpo.replaceChildren(carregando(2), carregando(2));
    try { await comCache("/api/fila?de=" + encodeURIComponent(estadoFila.de), d => { dados = d; desenhar(); }); }
    catch (e) { if (!dados) corpo.replaceChildren(falha(e.message)); }
  }
  function desenhar() {
    if (dados.aviso) { abas.replaceChildren(); resumo.textContent = ""; return corpo.replaceChildren(h("div", { class: "aviso" }, dados.aviso)); }
    const modulos = [...new Set(dados.tickets.map(t => moduloDe(t)).filter(Boolean))].sort();
    servSel.replaceChildren(h("option", { value: "" }, "Todo módulo"), ...modulos.map(m => h("option", { value: m }, m)));
    servSel.value = modulos.includes(estadoFila.servico) ? estadoFila.servico : "";
    const porEmpresa = {};
    for (const t of dados.tickets) if (t.empresa) porEmpresa[t.empresa] = (porEmpresa[t.empresa] || 0) + 1;
    const empresas = Object.keys(porEmpresa).sort((a, b) => a.localeCompare(b, "pt-BR"));
    empSel.replaceChildren(h("option", { value: "" }, "Todas as empresas"), ...empresas.map(e => h("option", { value: e }, `${e} (${porEmpresa[e]})`)));
    empSel.value = empresas.includes(estadoFila.empresa) ? estadoFila.empresa : "";
    // empresa, módulo e urgência filtram; a aba separa pela situação
    const filtrados = dados.tickets.filter(t =>
      (!empSel.value || t.empresa === empSel.value) &&
      (!servSel.value || moduloDe(t) === servSel.value) &&
      (!estadoFila.urgencia || (estadoFila.urgencia === "urgentes" ? t.triagem.urgente : urgenciaDe(t) === estadoFila.urgencia)));
    const contagem = Object.fromEntries(SITUACOES.map(([s]) => [s, filtrados.filter(t => t.situacao === s).length]));
    if (!estadoFila.aba || (estadoFila.aba === "outros" && !contagem.outros))
      estadoFila.aba = (SITUACOES.find(([s]) => contagem[s]) || SITUACOES[0])[0];
    abas.replaceChildren(...SITUACOES.filter(([s]) => s !== "outros" || contagem.outros).map(([s, rotulo]) =>
      h("button", { class: "aba" + (s === "outros" ? " discreta" : ""), role: "tab", "aria-selected": String(s === estadoFila.aba),
        onclick: () => { estadoFila.aba = s; desenhar(); } }, rotulo, h("span", { class: "contagem" }, contagem[s]))));
    const urgentes = dados.tickets.filter(t => t.triagem.urgente).length;
    const semPlanner = dados.tickets.filter(t => t.situacao === "produto" && !t.planner).length;
    resumo.textContent = `${dados.tickets.length} abertos · ${urgentes} urgentes` + (semPlanner ? ` · ${semPlanner} com o produto sem link do Planner` : "");
    const lista = ordenar(filtrados.filter(t => t.situacao === estadoFila.aba), estadoFila.ordem);
    if (!lista.length) return corpo.replaceChildren(h("div", { class: "cartao vazio" }, "Nenhum ticket aqui com esses filtros."));
    corpo.replaceChildren(...lista.map(t => itemFila(t, estadoFila.de !== "meus", estadoFila.ordem === "sem_resposta")));
  }
  carregar();
}
// Ticket com o time de produto: deve citar o card do Planner numa conversa interna.
// A API do Movidesk só entrega o texto da conversa (o link vira o título), então o clique abre a URL
// quando ela veio crua e, senão, o ticket no Movidesk, onde o link do Planner é clicável.
function seloPlanner(t, dentroDeLink) {
  const p = t.planner;
  if (!p) return h("span", { class: "planner falta", title: "Todo ticket do time de produto deve ter o link do Planner numa conversa interna" },
    icone("planner", 15), h("b", {}, "Sem link do Planner"), h("span", {}, "registre o card numa conversa interna"));
  const destino = p.url || (eu.movidesk_url ? `${eu.movidesk_url}/Ticket/EditByProtocol/${t.protocolo}` : null);
  const quem = (p.responsaveis || []).map(n => n.split(/\s+/)[0]).join(", ");
  const atrasado = p.prazo && !p.concluido && new Date(p.prazo + "T23:59:59") < new Date();
  const ajuda = [p.url ? "Abrir o card no Planner" : "Abrir o ticket no Movidesk: o link do Planner está na conversa interna",

function respostaFormatada(texto) {
  const partes = texto.split(/```[a-zA-Z]*\n?/);
  return partes.map((p, i) => {
    if (i % 2 === 0) return p.trim() ? h("div", { class: "corpo" }, p.trim()) : null;
    const codigo = p.replace(/\s+$/, "");
    const copiar = h("button", { class: "botao pequeno copiar", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(codigo); copiar.textContent = "Copiado"; setTimeout(() => copiar.textContent = "Copiar", 1500); } catch { toast("Não consegui copiar."); }
    } }, "Copiar");
    return h("pre", { class: "codigo" }, copiar, codigo);
  });
}
async function perguntarEm(conversa, entrada, ticket_id, historico = []) {
  const pergunta = entrada.value.trim();
  if (pergunta.length < 3) return;
  entrada.value = "";
  conversa.append(h("div", { class: "msg-eu" }, pergunta));
  const icone = h("div", { class: "icone" }); icone.innerHTML = '<svg><use href="#elo"/></svg>';

  conversa.append(h("div", { class: "msg-elo" }, icone, cartao));
  cartao.scrollIntoView({ behavior: "smooth", block: "end" });
  let texto = "";
  try {
    const memoria = historico.slice(-MAX_TURNOS_PERGUNTE);
    await aoVivo("/api/perguntar", { method: "POST", body: { pergunta, ticket_id: ticket_id || null, historico: memoria } }, ev => {
      if (ev.erro) throw new Error(ev.erro);
      if (ev.t != null) {
        if (!texto) { corpo.className = "corpo escrevendo"; cartao.replaceChildren(corpo); }
        texto += ev.t;
        corpo.textContent = texto;
        return;
      }
      if (ev.fim) {
        const r = ev.fim;
        const fontes = r.fontes.map(f => f.tipo === "caso"
          ? h("span", {}, h("a", { class: "etiqueta violeta", href: "#/caso/" + f.id }, `[${f.n}] ${f.titulo}`), linkMovidesk(f.id, f.protocolo, "↗"))
          : /^https?:/.test(f.fonte || "") ? h("a", { class: "etiqueta violeta", href: f.fonte, target: "_blank", rel: "noopener" }, `[${f.n}] Doc · ${f.titulo}`)
          : h("a", { class: "etiqueta violeta", href: "/api/documentos/arquivo?fonte=" + encodeURIComponent(f.fonte), target: "_blank", rel: "noopener", title: "Abrir o documento" }, `[${f.n}] Doc · ${f.titulo}`));
        const grupo = [];

        const nao = botaoAvaliar("Não útil", "pergunta", "nao_util", ticket_id || null, { pergunta_id: r.id }, grupo);
        grupo.push(util, nao);
        util.classList.add("pequeno"); nao.classList.add("pequeno");
        // a memória guarda a pergunta já completa: a próxima continuação parte dela
        historico.push({ pergunta: r.entendida || pergunta, resposta: r.encontrou ? r.resposta : "",
          fontes: r.fontes.map(f => ({ tipo: f.tipo, id: f.id ?? null, fonte: f.fonte ?? null })) });

          ...respostaFormatada(r.resposta),
          fontes.length ? h("div", { class: "fontes" }, "Fontes:", ...fontes) : null,
          h("div", { class: "fontes" }, util, nao, h("span", {}, `${r.segundos} s`))].filter(Boolean));
      }
    });
  } catch (e) { if (e.name !== "AbortError") cartao.replaceChildren(falha(e.message)); }

// Markdown simples (títulos, listas, tabelas, negrito, código), montado com elementos: nada do arquivo vira HTML.
function markdownSimples(texto) {
  const blocos = [];
  let lista = null, paragrafo = [], tabela = null;
  const inline = (linha) => linha.split(/(\*\*[^*]+\*\*|`[^`]+`)/).map(p =>
    /^\*\*.+\*\*$/.test(p) ? h("b", {}, p.slice(2, -2)) : /^`.+`$/.test(p) ? h("code", {}, p.slice(1, -1)) : p);
  const fechar = () => {
    if (paragrafo.length) { blocos.push(h("p", {}, ...inline(paragrafo.join(" ")))); paragrafo = []; }
    lista = null; tabela = null;
  };
  for (const linha of texto.split(/\r?\n/)) {
    const t = linha.trim(), titulo = t.match(/^(#{1,4})\s+(.*)$/), item = t.match(/^(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (!t) { fechar(); continue; }
    if (/^\|.*\|$/.test(t)) {  // tabela: a 1ª linha é o cabeçalho; a de |---| só separa
      const celulas = t.slice(1, -1).split("|").map(c => c.trim());
      if (celulas.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!tabela) {
        fechar();
        tabela = h("tbody");
        blocos.push(h("div", { class: "tabela-rolavel" }, h("table", {}, h("thead", {}, h("tr", {}, ...celulas.map(c => h("th", {}, ...inline(c))))), tabela)));
      } else tabela.append(h("tr", {}, ...celulas.map(c => h("td", {}, ...inline(c)))));
      continue;
    }
    tabela = null;
    if (titulo) { fechar(); blocos.push(h("h" + Math.min(4, titulo[1].length + 1), {}, ...inline(titulo[2]))); continue; }
    if (item) {
      if (paragrafo.length) { blocos.push(h("p", {}, ...inline(paragrafo.join(" ")))); paragrafo = []; }
      if (!lista) { lista = h("ul"); blocos.push(lista); }
      lista.append(h("li", {}, ...inline(item[1])));
      continue;
    }
    lista = null;
    paragrafo.push(t);
  }
  fechar();
  return blocos;
}

  // pausar a pré-geração: o Elo fica no ar, mas só usa a GPU quando alguém pede um rascunho ou pergunta
  const pausa = h("input", { type: "checkbox", class: "interruptor", disabled: true, onchange: async () => {
    try { await api("/api/pregeracao", { method: "PUT", body: { pausada: pausa.checked } }); }
    catch (e) { pausa.checked = !pausa.checked; toast(e.message); }
  } });
  api("/api/pregeracao").then(d => { pausa.checked = d.pausada; pausa.disabled = false; }).catch(() => {});
  const chavePausa = h("label", { class: "linha-chave", style: "margin-bottom:14px" },
    h("span", {}, h("b", {}, "Pausar a pré-geração de rascunhos"), h("br"),
      h("span", { class: "meta" }, "O Elo continua no ar e gera o rascunho na hora em que alguém abre o ticket, mas para de usar a GPU em segundo plano. Bom para jogar ou usar programas pesados sem desligar.")),
    pausa);
  return h("div", { class: "cartao bloco" }, h("h2", {}, "Servidor"), chavePausa,
    h("p", { class: "meta" }, "O Elo continua ligado mesmo com o navegador fechado (atualizando a fila e pré-gerando rascunhos na GPU). Desligue antes de usar programas pesados. Também dá para desligar pelo ícone do Elo perto do relógio do Windows."),
    acao);
}
// Etapa 0: o tempo real de cada tela e do LLM, medido em cada uso (últimas 24 h).
function cartaoDesempenho() {
  const corpo = h("div", {}, carregando(2));
  const ms = (x) => x == null ? "—" : x < 1000 ? Math.round(x) + " ms" : (x / 1000).toFixed(1).replace(".", ",") + " s";
  api("/api/desempenho?horas=24").then(d => {
    const espera = d.espera.map(e => h("tr", {}, h("td", {}, e.uso), h("td", {}, e.n),
      h("td", {}, ms(e.primeira_palavra_p50)), h("td", {}, ms(e.primeira_palavra_p95)), h("td", {}, ms(e.total_p50))));
    const llm = d.llm.map(e => h("tr", {}, h("td", {}, e.uso), h("td", {}, e.n), h("td", {}, e.tokens_por_segundo_p50 + " tokens/s"),
      h("td", {}, ms(e.total_p50)), h("td", {}, e.interrompidas)));
    const rotas = d.rotas.slice(0, 8).map(r => h("tr", {}, h("td", {}, r.rota.replace("/api/", "/")), h("td", {}, r.n),
      h("td", {}, ms(r.p50)), h("td", { class: r.p95 > 1000 ? "ruim" : "" }, ms(r.p95)),
      h("td", { class: "meta" }, Object.entries(r.etapas).map(([k, v]) => `${k} ${ms(v.p50)}`).join(" · ") || "memória")));
    const tabela = (cab, linhas) => h("div", { class: "tabela-rolavel" }, h("table", {},
      h("thead", {}, h("tr", {}, ...cab.map(c => h("th", {}, c)))), h("tbody", {}, ...linhas)));
    corpo.replaceChildren(
      d.eventos ? null : h("p", { class: "meta" }, "Ainda sem medições desde que o Elo subiu."),
      espera.length ? tabela(["Espera de quem usa", "Vezes", "1ª palavra (p50)", "1ª palavra (p95)", "Total (p50)"], espera) : null,
      llm.length ? tabela(["LLM", "Gerações", "Velocidade (p50)", "Total (p50)", "Interrompidas"], llm) : null,
      rotas.length ? tabela(["Tela (rota)", "Chamadas", "p50", "p95", "Onde o tempo vai (p50)"], rotas) : null);
  }).catch(e => corpo.replaceChildren(falha(e.message)));
  return h("div", { class: "cartao bloco" }, h("h2", {}, "Desempenho (últimas 24 h)"),
    h("p", { class: "meta" }, "p50 = metade das vezes foi mais rápido que isso; p95 = 95% das vezes. Interrompidas = pré-geração que cedeu a GPU para alguém esperando."),
    corpo);
}
function linhasUsuario(u) {
  const souEu = u.id === eu.id;
  const salvar = (campo, valor) => api(`/api/usuarios/${u.id}`, { method: "PATCH", body: { [campo]: valor } }).catch(e => { toast(e.message); telaConfig(); });
  const papel = h("select", { class: "campo compacto", "aria-label": "Papel de " + u.nome, disabled: souEu, title: souEu ? "Você não pode tirar o seu próprio acesso de admin" : null,
    onchange: () => salvar("papel", papel.value) }, ...["analista", "gestor", "admin"].map(p => h("option", { value: p, selected: p === u.papel }, PAPEL[p])));
  const nivel = h("select", { class: "campo compacto", "aria-label": "Nível de " + u.nome, onchange: () => salvar("nivel", nivel.value) },
    ...["N1", "N2", "N3"].map(n => h("option", { value: n, selected: n === u.nivel }, n)));
  const ativo = souEu ? null : h("button", { class: "botao pequeno", onclick: async () => { await salvar("ativo", !u.ativo); telaConfig(); } }, u.ativo ? "Desativar" : "Reativar");
  const excluir = souEu ? null : h("button", { class: "botao pequeno", title: "Apagar o cadastro de vez", onclick: () => {
    excluir.replaceWith(h("span", { class: "meta" }, "Excluir de vez? ",
      h("button", { class: "botao pequeno", style: "border-color:var(--rosa);color:var(--rosa)", onclick: async () => {
        try { await api(`/api/usuarios/${u.id}`, { method: "DELETE" }); toastOk(`Cadastro de ${u.nome} excluído.`); } catch (e) { toast(e.message); }
        telaConfig();
      } }, "Sim, excluir"), " ", h("button", { class: "botao pequeno", onclick: () => telaConfig() }, "Não")));
  } }, "Excluir");
  // a linha da senha fica escondida até o admin clicar em "Definir senha"
  const nova = h("input", { class: "campo", type: "password", minlength: "8", required: true, autocomplete: "new-password", placeholder: "Nova senha (mín. 8 caracteres)", style: "max-width:280px" });
  const aviso = h("span", { class: "meta" });
  const linhaSenha = h("tr", { hidden: true }, h("td", { colspan: "4" },
    h("form", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap", onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api(`/api/usuarios/${u.id}/senha`, { method: "PUT", body: { nova: nova.value } });
        nova.value = ""; aviso.className = "etiqueta verde";
        aviso.textContent = souEu ? "Senha trocada." : "Senha definida. As sessões abertas dessa pessoa foram encerradas; passe a senha nova para ela.";
      } catch (err) { aviso.className = "erro"; aviso.textContent = err.message; }
    } }, h("span", {}, `Nova senha de ${u.nome}:`), nova, h("button", { class: "botao primario pequeno" }, "Salvar"),
      h("button", { class: "botao pequeno", type: "button", onclick: () => { linhaSenha.hidden = true; } }, "Cancelar"), aviso)));
  const senha = h("button", { class: "botao pequeno", onclick: () => { linhaSenha.hidden = !linhaSenha.hidden; if (!linhaSenha.hidden) nova.focus(); } }, "Definir senha");
  return [h("tr", { style: u.ativo ? "" : "opacity:.5" },
    h("td", {}, h("div", { class: "usuario-nome" }, u.nome, souEu ? h("span", { class: "meta" }, " (você)") : null),
      h("div", { class: "meta usuario-detalhe" }, u.email, u.movidesk_id ? ` · Movidesk ${u.movidesk_id}` : " · sem agente do Movidesk")),
    h("td", {}, papel), h("td", {}, nivel),
    h("td", { class: "acoes-usuario" }, senha, ativo, excluir)), linhaSenha];
}

// ---------- minha conta ----------
function telaConta() {
  const atual = h("input", { class: "campo", type: "password", required: true, autocomplete: "current-password" });
  const nova = h("input", { class: "campo", type: "password", required: true, minlength: "8", autocomplete: "new-password" });
  const repetir = h("input", { class: "campo", type: "password", required: true, minlength: "8", autocomplete: "new-password" });
  const aviso = h("div", { hidden: true });
  const enviar = h("button", { class: "botao primario" }, "Trocar senha");
  app.replaceChildren(h("div", { class: "estreito", style: "max-width:480px" },
    h("h1", {}, "Minha conta"),
    h("p", { class: "meta" }, `${eu.nome} · ${eu.email} · ${[PAPEL[eu.papel], eu.nivel].filter(Boolean).join(" ")}`),
    h("div", { class: "cartao bloco" }, h("h2", {}, "Aparência"),
      campoTema(),
      h("p", { class: "meta", style: "margin:10px 0 0" }, "Automático segue o tema do Windows. A escolha fica salva neste navegador.")),
    h("div", { class: "cartao bloco" }, h("h2", {}, "Trocar senha"),
      h("form", { style: "display:grid;gap:14px", onsubmit: async (e) => {
        e.preventDefault();
        aviso.hidden = false;
        if (nova.value !== repetir.value) { aviso.className = "erro"; aviso.textContent = "As duas senhas novas não são iguais."; return; }
        enviar.disabled = true;
        try {
          await api("/api/eu/senha", { method: "PUT", body: { atual: atual.value, nova: nova.value } });
          atual.value = nova.value = repetir.value = "";
          aviso.className = "aviso"; aviso.style.cssText = "background:var(--verde-claro);color:var(--verde)";
          aviso.textContent = "Senha trocada. Suas outras sessões abertas foram encerradas.";
        } catch (err) { aviso.className = "erro"; aviso.style.cssText = ""; aviso.textContent = err.message; }
        finally { enviar.disabled = false; }
      } },
        h("div", {}, h("label", { class: "rotulo" }, "Senha atual"), atual),
        h("div", {}, h("label", { class: "rotulo" }, "Nova senha (mín. 8 caracteres)"), nova),
        h("div", {}, h("label", { class: "rotulo" }, "Repita a nova senha"), repetir),
        aviso, enviar))));
  atual.focus();
}

// ---------- tema (fica neste navegador) ----------
const TEMAS = [["auto", "Automático"], ["light", "Claro"], ["dark", "Escuro"]];
function temaEscolhido() { try { return localStorage.getItem("elo-tema") || "auto"; } catch { return "auto"; } }
function temaEscuroAgora() {
  const t = temaEscolhido();
  return t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
}
function aplicarTema(t) {
  try { t === "auto" ? localStorage.removeItem("elo-tema") : localStorage.setItem("elo-tema", t); } catch {}
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  desenharBotaoTema();
}
function desenharBotaoTema() {
  const b = document.getElementById("tema");
  const escuro = temaEscuroAgora();
  b.title = escuro ? "Mudar para o tema claro" : "Mudar para o tema escuro";
  b.setAttribute("aria-label", b.title);
  b.innerHTML = escuro  // mostra o destino: sol no escuro, lua no claro
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
document.getElementById("tema").addEventListener("click", () => aplicarTema(temaEscuroAgora() ? "light" : "dark"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", desenharBotaoTema);
desenharBotaoTema();
function campoTema() {
  const grupo = h("div", { class: "segmentos", role: "group", "aria-label": "Tema" });
  const desenhar = () => grupo.replaceChildren(...TEMAS.map(([v, r]) => h("button", { type: "button", "aria-pressed": String(temaEscolhido() === v),
    onclick: () => { aplicarTema(v); desenhar(); } }, r)));
  desenhar();
  return grupo;
}

// ---------- início ----------
// logou agora: sempre a Fila, mesmo que o endereço tenha ficado em outra tela; F5 com a sessão aberta fica onde está
async function comecar(logou = false) {
  try { eu = await api("/api/eu"); } catch { return telaEntrar(); }
  document.getElementById("topo").hidden = false;
  document.getElementById("avatar").textContent = iniciais(eu.nome);
  document.getElementById("nome").textContent = eu.nome.split(/\s+/)[0];
  document.querySelector(".topo .conta").title = `${eu.nome} · minha conta e senha`;
  document.getElementById("papel").textContent = [PAPEL[eu.papel], eu.nivel].filter(Boolean).join(" ");
  if (logou || !location.hash || location.hash === "#/") { if (location.hash === inicio()) rotear(); else location.hash = inicio(); } else rotear();
}
document.getElementById("sair").addEventListener("click", async () => { await api("/api/sair", { method: "POST" }).catch(() => {}); eu = null; location.hash = ""; telaEntrar(); });
comecar();
</script>
